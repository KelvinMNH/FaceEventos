services:
  oracle-db:
    image: gvenzl/oracle-free:latest
    container_name: unieventos-oracle
    restart: unless-stopped
    ports:
      - "1521:1521"
    environment:
      - ORACLE_PASSWORD=unieventos123
      - APP_USER=unieventos
      - APP_USER_PASSWORD=unieventos123
    volumes:
      - oracle_data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD-SHELL", "exit | sqlplus -S / as sysdba"]
      interval: 30s
      timeout: 10s
      retries: 15

  backend:
    build:
      context: ./backend
    ports:
      - "3000:3000"
    restart: unless-stopped
    depends_on:
      oracle-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/status"]
      interval: 30s
      timeout: 10s
      retries: 3
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - DB_DIALECT=oracle
      - DB_HOST=oracle-db
      - DB_PORT=1521
      - DB_SERVICE_NAME=FREEPDB1
      - DB_NAME=FREEPDB1
      - DB_USER=unieventos
      - DB_PASS=unieventos123

  frontend:
    build:
      context: ./frontend
    ports:
      - "5174:80"
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - NODE_ENV=production

volumes:
  oracle_data:
